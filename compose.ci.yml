# Ephemeral CI only. Never point these credentials at an existing database.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cypher
      POSTGRES_USER: cypher_user
      POSTGRES_PASSWORD: ci-only-password
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cypher_user -d cypher']
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: .
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ci-only-password
      JWT_SECRET: ${JWT_SECRET:?CI must generate an ephemeral signing key}
      REPORTING_URL: http://reporting:5001
      JPA_SHOW_SQL: 'false'
    ports: ['127.0.0.1:8081:8081']
    depends_on:
      postgres:
        condition: service_healthy
  reporting:
    build:
      context: .
      dockerfile: reporting/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ci-only-password
    depends_on:
      postgres:
        condition: service_healthy
