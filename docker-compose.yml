# CYPHER - local development stack (MoSCoW M-10).
#
#   cp .env.example .env      # then set DB_PASSWORD and JWT_SECRET
#   docker compose up --build
#
# The gateway serves the cockpit itself at http://localhost:8081. Prometheus
# and Grafana are included so monitoring is part of the stack, not a claim in
# a report. Jenkins and LocalStack S3 are optional profiles.
#
# The legacy `version:` key is gone: Docker Compose v2 ignores it and warns.

services:

  postgres:
    image: postgres:16
    container_name: cypher-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cypher}
      POSTGRES_USER: ${DB_USER:-cypher_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # Published on 5433 so a developer who already runs PostgreSQL on 5432
      # (Homebrew, apt) can keep both. Inside the network it is still 5432.
      - "5433:5432"
    volumes:
      - cypher_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cypher_user} -d ${DB_NAME:-cypher}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: cypher-backend
    restart: unless-stopped
    depends_on:
      postgres:
        # Wait for "ready to accept connections", not merely "started": Flyway
        # migrates at boot and would otherwise fail connecting.
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cypher}
      DB_USER: ${DB_USER:-cypher_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Required: JwtService refuses to start on the committed development key.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - openssl rand -base64 64}
      REPORTING_URL: http://reporting:5001
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
    ports:
      - "8081:8081"

  reporting:
    build: ./reporting
    container_name: cypher-reporting
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cypher}
      DB_USER: ${DB_USER:-cypher_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REPORTING_BIND: 0.0.0.0
      REPORTING_PORT: 5001

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cypher-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cypher_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_started

  grafana:
    image: grafana/grafana:11.4.0
    container_name: cypher-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-deploy}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cypher-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - cypher_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

  localstack:
    image: localstack/localstack:stable
    profiles: ["media"]
    container_name: cypher-local-s3
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEBUG: "0"
    volumes:
      - cypher_local_s3_data:/var/lib/localstack
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  local-s3-init:
    image: localstack/localstack:stable
    profiles: ["media"]
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-south-1
    entrypoint:
      - /bin/sh
      - -c
      - >
        awslocal --endpoint-url=http://localstack:4566 s3api create-bucket
        --bucket cypher-media --region ap-south-1
        --create-bucket-configuration LocationConstraint=ap-south-1 >/dev/null 2>&1 || true

  jenkins:
    build: ./infra/jenkins
    profiles: ["ci"]
    container_name: cypher-jenkins
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-change-me-before-starting-jenkins}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cypher}
      DB_USER: ${DB_USER:-cypher_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - openssl rand -base64 64}
    volumes:
      - cypher_jenkins_home:/var/jenkins_home
    ports:
      - "8088:8080"
      - "50000:50000"

volumes:
  cypher_pgdata:
  cypher_prometheus_data:
  cypher_grafana_data:
  cypher_local_s3_data:
  cypher_jenkins_home:
