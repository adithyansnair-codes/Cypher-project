# Offline evidence-store profile:
#
#   docker compose -f docker-compose.yml -f docker-compose.media.yml \
#     --profile media up -d --build
#
# The backend talks to LocalStack's S3 emulator by its private service name, while presigned
# download links use localhost because that is where the developer's browser
# opens them. No AWS account or internet connection is required.

services:
  backend:
    environment:
      S3_BUCKET: cypher-media
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      S3_PATH_STYLE: "true"
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
