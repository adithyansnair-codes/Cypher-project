name: Approved staging deployment
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY STAGING; uses main at the selected commit, never production'
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: cypher-staging-deploy
  cancel-in-progress: false
jobs:
  eligibility:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/ci/require_green_ci.py
        env:
          GH_TOKEN: ${{ github.token }}
  deploy:
    needs: eligibility
    environment: staging
    if: vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require explicit environment approval configuration
        env:
          APPROVAL_CONFIGURED: ${{ vars.STAGING_APPROVAL_CONFIGURED }}
        run: test "$APPROVAL_CONFIGURED" = true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Registry login and image names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: backend
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          provenance: true
          sbom: true
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: reporting
        with:
          context: .
          file: reporting/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-reporting:${{ github.sha }}
          cache-from: type=gha,scope=reporting
          provenance: true
          sbom: true
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-backend@${{ steps.backend.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-reporting@${{ steps.reporting.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Record immutable release manifest
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          REPORTING_DIGEST: ${{ steps.reporting.outputs.digest }}
        run: |
          printf 'BACKEND_IMAGE=%s-backend@%s\nREPORTING_IMAGE=%s-reporting@%s\n' "$IMAGE_PREFIX" "$BACKEND_DIGEST" "$IMAGE_PREFIX" "$REPORTING_DIGEST" > images.env
      - name: Deploy to pre-approved dedicated staging host
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$STAGING_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$STAGING_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$STAGING_SSH_KEY" && test -n "$STAGING_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/"*
          target="$STAGING_USER@$STAGING_HOST"
          release="/opt/cypher-staging/releases/$GITHUB_SHA"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "mkdir -p '$release'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes compose.staging.yml images.env scripts/ci/deploy_staging.sh "$target:$release/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "bash '$release/deploy_staging.sh' '$release'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: staging-release-${{ github.sha }}
          path: images.env
          retention-days: 30
      - name: Remove credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          docker logout ghcr.io
