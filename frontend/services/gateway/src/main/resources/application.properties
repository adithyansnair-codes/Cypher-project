spring.application.name=cypher-gateway

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/cypher?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:cypher}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

cypher.service-api-key=${SERVICE_API_KEY}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
