global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: cypher-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]
        labels:
          environment: local-compose

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
