global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: cypher-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          environment: aws-ec2

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
