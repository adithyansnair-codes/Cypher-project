# Amazon RDS for MySQL. Use DB_SSL_MODE=DISABLED only for local tests.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:cypher}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${DB_SSL_MODE:REQUIRED}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.locations=classpath:db/mysql
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
