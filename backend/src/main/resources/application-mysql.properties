# ---------------------------------------------------------------------------
# DA2 / managed-database profile: Amazon RDS for MySQL.
#
# This profile is opt-in (`SPRING_PROFILES_ACTIVE=mysql`). The local and
# Compose defaults remain PostgreSQL 16. RDS already owns the MySQL schema,
# so Flyway's PostgreSQL migrations are disabled and Hibernate validates the
# entities against that managed schema without mutating it.
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:cypher}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
