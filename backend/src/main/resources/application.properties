spring.application.name=cypher-backend

# ============================================================================
# LOCAL DEVELOPMENT DEFAULTS
# ----------------------------------------------------------------------------
# The values below are development defaults, committed on purpose so that a
# fresh clone runs with a single command and no exports:
#
#     ./mvnw spring-boot:run
#
# Every one of them is written as ${VAR:default}, so a REAL environment
# variable always wins. Deployments therefore override these by setting
# DB_PASSWORD / JWT_SECRET in the environment and never touch this file.
#
# Before any public deployment, rotate the database password and the JWT secret.
# ============================================================================

# ---------------------------------------------------------------- server ----
server.port=${SERVER_PORT:8081}

# ------------------------------------------------------------ datasource ----
# DB_PASSWORD below is the DEVELOPMENT password created by scripts/setup-db.sh.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cypher}
spring.datasource.username=${DB_USER:cypher_user}
spring.datasource.password=${DB_PASSWORD:proj577!}

# -------------------------------------------------------------------- jpa ----
# validate == check every entity against the real schema and refuse to boot on a
# mismatch. The schema is owned by Flyway migrations, never by Hibernate.
# Do NOT switch this to `update`: it silently mutates the database and the
# migration history stops being the source of truth.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------------- flyway ----
# db/migration/V1__initial_schema.sql  -> 16 tables, triggers, views, functions
# db/migration/V2__seed_data.sql       -> demo data with real BCrypt passwords
# db/migration/V3__fix_alert_trigger_and_status_constraints.sql
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ------------------------------------------------------------------- jwt -----
# A DEVELOPMENT-ONLY signing key (base64, 64 bytes). JwtService refuses to start
# on a blank or short value, so this default is what makes a bare
# `./mvnw spring-boot:run` work; without it the app exits with
# "jwt.secret is not set".
#
# ANY deployment must override it:
#     export JWT_SECRET="$(openssl rand -base64 64 | tr -d '\n')"
# A token signed with this public key is forgeable, so treat it as compromised.
jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1jeXBoZXItand0LXNpZ25pbmcta2V5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0wMTIzNDU2Nzg5}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------- cors ---------
# Only used when the cockpit is NOT served by this app (a Vite dev server, say).
# Comma-separated. Never "*": this API carries a bearer token.
cypher.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# ------------------------------------------------------------------ error ----
# Keep the message (so validation failures are readable) but never the trace,
# which would leak internal class names to clients.
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

logging.level.com.cypher.backend=${LOG_LEVEL:INFO}
