# Monitoring for the systemd-managed MySQL/DA2 backend on EC2:
#
#   docker compose -f docker-compose.yml \
#     -f docker-compose.aws-monitoring.yml \
#     up -d --no-deps prometheus grafana

services:
  prometheus:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.aws.yml:/etc/prometheus/prometheus.yml:ro
      - cypher_prometheus_data:/prometheus

  grafana:
    depends_on: []
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://13.207.55.75:8080/absproxy/3000/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
